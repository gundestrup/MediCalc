# Semgrep configuration for MediCalc
# CE-only local rules — no registry packs (see engineering-memory tools/semgrep.md)
# https://semgrep.dev/docs/
#
# Run: semgrep scan --config .semgrep.yml --error app/ lib/ config/

rules:
  # Detect String#scan with unanchored polynomial regex (ReDoS).
  # Excludes StringScanner#scan, which advances positionally and cannot backtrack.
  - id: ruby-redos-string-scan
    languages: [ruby]
    severity: WARNING
    message: "String#scan with unanchored polynomial regex may cause ReDoS"
    patterns:
      - pattern: $X.scan($REGEX)
      - pattern-not-regex: 'scanner\.scan\('
      - pattern-not: $X.scan("$LITERAL")
    options:
      symbolic_propagation: true
    metavariable-analysis:
      analyzer: redos
      metavariable: $REGEX

  # Detect use of eval with variable input.
  - id: ruby-eval-usage
    languages: [ruby]
    severity: ERROR
    message: "Use of eval() is dangerous — avoid dynamic code execution"
    pattern: eval($VAR)
    metadata:
      owasp: "A03:2021 - Injection"
      cwe: "CWE-95: Code Injection"

  # Detect command injection via backticks or system with variable input.
  - id: ruby-command-injection
    languages: [ruby]
    severity: ERROR
    message: "Command execution with variable input — potential command injection"
    pattern-either:
      - pattern: system($CMD)
      - pattern: exec($CMD)
      - pattern: spawn($CMD)
      - pattern: IO.popen($CMD)
      - pattern: Open3.capture3($CMD)
      - pattern: Open3.capture2($CMD)
    metadata:
      owasp: "A03:2021 - Injection"
      cwe: "CWE-78: OS Command Injection"
