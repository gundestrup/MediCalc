# SonarQube Cloud automatic-analysis configuration.
# Note: .sonarcloud.properties does NOT support wildcard patterns —
# files must be listed explicitly.

# The five generated Rails error pages are near-identical boilerplate and
# account for all 585 duplicated lines (40% density). Exclude them from
# copy-paste detection rather than padding the metric.
sonar.cpd.exclusions=public/400.html,public/404.html,public/406-unsupported-browser.html,public/422.html,public/500.html
