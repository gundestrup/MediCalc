version: 2
updates:
- package-ecosystem: bundler
  directory: "/"
  schedule:
    interval: weekly
  open-pull-requests-limit: 10
  cooldown:
    default-days: 7
  ignore:
    # json ~> 2.0 is pinned: json 3.x changed JSON.parse arity and
    # breaks ActiveSupport session decryption (see AGENTS.md).
    - dependency-name: "json"
      update-types: ["version-update:semver-major"]
  groups:
    gems:
      patterns:
      - "*"
- package-ecosystem: github-actions
  directory: "/"
  schedule:
    interval: weekly
  open-pull-requests-limit: 10
  cooldown:
    default-days: 7
  groups:
    actions:
      patterns:
      - "*"
