name: CI

on:
  pull_request:
  push:
    branches: [ main ]

jobs:
  markdownlint:
    name: Markdown lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Lint Markdown
        uses: DavidAnson/markdownlint-cli2-action@21c1be1b93ad9ed58fa840aacc3f279cde2a72ff
        with:
          config: .markdownlint-cli2.jsonc
          globs: |
            AGENTS.md
            [Cc][Hh][Aa][Nn][Gg][Ee][Ll][Oo][Gg].md
            CLAUDE.md
            CONTRIBUTING.md
            DEVIN.md
            DOCUMENTATION.md
            [Rr][Ee][Aa][Dd][Mm][Ee].md
            README.Development.md
            README.developer.md
            README.performance.md
            README.devel*.md
            RELEASE.md
            SECURITY.md
            STYLING.md
            TESTING.md
            WINDSURF.md
            .devin/*.md
            .github/**/*.md

  scan_ruby:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install ImageMagick dev headers (rmagick)
        run: sudo apt-get update && sudo apt-get install -y libmagickwand-dev

      - name: Set up Ruby
        uses: ruby/setup-ruby@a0102e0972be65f351c307e2d64b9314a57c8073 # v1.324.0
        with:
          bundler-cache: true

      - name: Scan for common Rails security vulnerabilities using static analysis
        run: bin/brakeman --no-pager
      
      - name: Scan for known security vulnerabilities in gems used
        run: bin/bundler-audit
      
  scan_js:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install ImageMagick dev headers (rmagick)
        run: sudo apt-get update && sudo apt-get install -y libmagickwand-dev

      - name: Set up Ruby
        uses: ruby/setup-ruby@a0102e0972be65f351c307e2d64b9314a57c8073 # v1.324.0
        with:
          bundler-cache: true

      - name: Scan for security vulnerabilities in JavaScript dependencies
        run: bin/importmap audit

  semgrep:
    name: Semgrep CE security scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Semgrep
        run: 'pip3 install --only-binary :all: "semgrep==1.176.0"'
      # CE-only: repo-local rules, no registry packs, no login, no metrics
      - name: Run Semgrep security scan
        run: semgrep scan --config .semgrep.yml --oss-only --metrics off --disable-version-check --error app/ lib/ config/ Rakefile
