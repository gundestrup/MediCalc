name: CI

on:
  pull_request:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  markdownlint:
    name: Markdown lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Lint Markdown
        uses: DavidAnson/markdownlint-cli2-action@696eb3f2509270d7b882d2aa68347bc676e7af34 # v25.0.0
        with:
          config: .markdownlint-cli2.jsonc
          globs: |
            AGENTS.md
            [Cc][Hh][Aa][Nn][Gg][Ee][Ll][Oo][Gg].md
            CLAUDE.md
            CONTRIBUTING.md
            DEVIN.md
            DOCUMENTATION.md
            [Rr][Ee][Aa][Dd][Mm][Ee].md
            README.Development.md
            README.developer.md
            README.performance.md
            README.devel*.md
            RELEASE.md
            SECURITY.md
            STYLING.md
            TESTING.md
            WINDSURF.md
            .devin/*.md
            .github/**/*.md

  scan_ruby:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install ImageMagick dev headers (rmagick)
        run: sudo apt-get update && sudo apt-get install -y libmagickwand-dev

      - name: Set up Ruby
        uses: ruby/setup-ruby@b3aaceaef7e0ee231b499e7b5f49c03fc1d32199 # v1.338.0
        with:
          bundler-cache: true

      - name: Scan for common Rails security vulnerabilities using static analysis
        run: bin/brakeman --no-pager
      
      - name: Scan for known security vulnerabilities in gems used
        run: bin/bundler-audit
      
  scan_js:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install ImageMagick dev headers (rmagick)
        run: sudo apt-get update && sudo apt-get install -y libmagickwand-dev

      - name: Set up Ruby
        uses: ruby/setup-ruby@b3aaceaef7e0ee231b499e7b5f49c03fc1d32199 # v1.338.0
        with:
          bundler-cache: true

      - name: Scan for security vulnerabilities in JavaScript dependencies
        run: bin/importmap audit

  semgrep:
    name: Semgrep CE security scan
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep:1.185.0@sha256:67518c174185a2043fdbed16c70631b79209499b3671178e7194379b48295a0d
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run Semgrep security scan
        run: semgrep scan --config .semgrep.yml --oss-only --metrics off --disable-version-check --error .
